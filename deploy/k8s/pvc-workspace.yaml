# The StorageClass has reclaimPolicy Delete: to delete this claim is to delete workspace_root.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robo-worker-work
  labels:
    app.kubernetes.io/name: robo-worker
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 5Gi
