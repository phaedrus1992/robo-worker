[project]
name = "robo-worker"
version = "0.1.0"
description = "Run claude -p jobs on repo checkouts and report them over MCP."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "anyio==4.15.1",
  "mcp==2.3.0",
  "pydantic==2.14.2",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[project.scripts]
robo-worker = "robo_worker.cli:main"

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "hypothesis==6.170.14",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "ty==0.0.95",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
