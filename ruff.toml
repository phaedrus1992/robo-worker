line-length = 100
target-version = "py314"
src = ["src", "tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C90", "TID"]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 5

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.per-file-ignores]
# Tests compare against literal values on purpose.
"tests/**" = ["PLR2004"]
